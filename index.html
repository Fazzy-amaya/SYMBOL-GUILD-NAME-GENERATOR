        #shield-hud {
            position: fixed;
            top: 18px;

            z-index: 9999;
            background: rgba(0,0,0,0.7);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);

        }
        #shield-hud .hud-threat {
            font-size: 0.6rem;
            color: #ff6666;
            text-align: center;
            letter-spacing: 1px;
            overflow: hidden;
            white-space: nowrap;
            text-overflow: ellipsis;
            max-width: 200px;

        @keyframes dotBlink {
            0%, 100% { opacity: 1; }
